name: ci
on: [push, pull_request]
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: protocol
        run: cd protocol && npm ci && npm run build && npm test
      - name: receiver
        run: cd emergency-receiver && npm ci && npx tsc --noEmit && npm test
      - name: gateway
        run: cd gateway && npm ci && npx tsc --noEmit && npm test
      - name: frontend
        run: cd frontend && npm ci && npm test && npm run build
      - name: network-simulator
        run: cd network-simulator && npm ci && npm test
      - name: ai-service
        run: cd ai-service && npm ci && npm run build
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r ml-service/requirements.txt pytest httpx
      - run: cd ml-service && python -m pytest tests -q
      - name: experiments reproduce (quick)
        run: cd experiments && python e3_localizer.py --quick
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: cd backend && mvn -q -B test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
